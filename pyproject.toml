[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acmad"
version = "0.1.0"
description = "Running example of asynchronous cascading multi-agent dispatch (AC-MAD) on 5G PHY processing"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pyarrow>=15,<26",  # 26 needs numpy >= 2
    "pyyaml>=6",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["matplotlib>=3.8", "jupyter", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acmad = ["dashboard/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["trace: needs the real trace (TrafficGenerator/traces.csv) and data/cloudric/"]
